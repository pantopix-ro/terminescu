<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminescu Workbench</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .band { position: absolute; top: 0; left: 0; width: 960px; height: 112px; }
  .band svg { display: block; width: 960px; height: 112px; shape-rendering: crispEdges; }
  .amber { fill: var(--amber); }
  .edge { fill: var(--amber-edge); }
  .slab { fill: var(--line-strong); }
  .hard { fill: var(--shadow); }
  .green { fill: var(--green); }
  .blue { fill: var(--blue); }
  .magenta { fill: var(--magenta); }
  .faint { fill: var(--faint); }
  .sq { rx: var(--radius-0); }
  .words { position: absolute; left: var(--space-6); right: var(--space-6); bottom: var(--space-6); }
  .name { margin: 0; font-family: var(--font-pixel); font-weight: 400; font-size: 56px; line-height: .95; color: var(--fg); white-space: nowrap; }
  .tag { margin: var(--space-3) 0 0 4px; font-family: var(--font-mono); font-size: 14px; line-height: 20px; color: var(--dim); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      amber 192x112 slab bled off the top (needs you, the one fill) over its shadow-hard 6px block; line-strong 344x88 bled off the right edge (the pane frame); blue 96x24 (running); green 24x24 (done); magenta 16x16 (pin): about 30% of 960x288
  arrangement top band, the skeleton for a name too wide for its zone at 64px: one tall amber slab with satellites on the left, the pane slab bleeding right, bottoms on one line
  pattern     tiles, from "the BlockStrip represents a run everywhere": three strips of seven 18x22 cells at a px (2px) gap cut into the line-strong slab, in green, amber, blue, faint, plus one amber breakpoint tick
  scales      sides in space-2 multiples, gutters space-4, cell gap px, row pitch 26 (22 + space-1), corners radius-0, shadow offset 6px from shadow-hard
-->
<rect class="hard sq" x="30" y="-10" width="192" height="120"/>
<rect class="amber sq" x="24" y="-16" width="192" height="120"/>
<rect class="edge sq" x="24" y="102" width="192" height="2"/>
<rect class="green sq" x="240" y="48" width="24" height="24"/>
<rect class="blue sq" x="240" y="80" width="96" height="24"/>
<rect class="magenta sq" x="352" y="88" width="16" height="16"/>
<rect class="slab sq" x="616" y="16" width="344" height="88"/>
<rect class="green sq" x="632" y="28" width="18" height="22"/>
<rect class="green sq" x="652" y="28" width="18" height="22"/>
<rect class="amber sq" x="672" y="28" width="18" height="22"/>
<rect class="faint sq" x="692" y="28" width="18" height="22"/>
<rect class="faint sq" x="712" y="28" width="18" height="22"/>
<rect class="faint sq" x="732" y="28" width="18" height="22"/>
<rect class="faint sq" x="752" y="28" width="18" height="22"/>
<rect class="green sq" x="632" y="54" width="18" height="22"/>
<rect class="green sq" x="652" y="54" width="18" height="22"/>
<rect class="green sq" x="672" y="54" width="18" height="22"/>
<rect class="green sq" x="692" y="54" width="18" height="22"/>
<rect class="blue sq" x="712" y="54" width="18" height="22"/>
<rect class="faint sq" x="732" y="54" width="18" height="22"/>
<rect class="faint sq" x="752" y="54" width="18" height="22"/>
<rect class="green sq" x="632" y="80" width="18" height="22"/>
<rect class="green sq" x="652" y="80" width="18" height="22"/>
<rect class="green sq" x="672" y="80" width="18" height="22"/>
<rect class="green sq" x="692" y="80" width="18" height="22"/>
<rect class="green sq" x="712" y="80" width="18" height="22"/>
<rect class="green sq" x="732" y="80" width="18" height="22"/>
<rect class="green sq" x="752" y="80" width="18" height="22"/>
<rect class="amber sq" x="656" y="20" width="12" height="2"/>
</svg>
</div>
<div class="words">
  <h1 class="name"><span>Terminescu Workbench</span></h1>
  <p class="tag">A terminal manager with a memory for every Claude session.</p>
</div>
</div>
</body>
</html>
