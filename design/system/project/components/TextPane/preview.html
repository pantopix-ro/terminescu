<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextPane</title></head>
<body>
<div style="position:relative;margin:16px;width:640px">
<section class="ao-tp focused" aria-label="Text editor" style="height:380px">
 <div class="ao-tp-head"><svg class="ao-icon" viewBox="0 0 8 8" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="1" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="0" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="0" y="7" width="1" height="1"/><rect x="1" y="7" width="1" height="1"/><rect x="2" y="7" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="5" y="7" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/></svg><span>review-plan.md</span><span>~/work/api/prompts</span><span class="grow"></span><span>Markdown</span></div>
 <div class="ao-ed" style="flex:1">
  <div class="ao-ed-l"><span class="n">1</span><span class="c"><span class="mk"># </span><span class="h1">Review the plan</span></span></div>
  <div class="ao-ed-l"><span class="n">2</span><span class="c"></span></div>
  <div class="ao-ed-l"><span class="n">3</span><span class="c">Read the plan at <span class="ao-vchip">{{plan}}</span> for branch <span class="ao-vchip">{{branch}}</span>.</span></div>
  <div class="ao-ed-l"><span class="n">4</span><span class="c">Ticket: <span class="ao-vchip unknown">{{ticket_url}}</span></span></div>
  <div class="ao-ed-l"><span class="n">5</span><span class="c">Call the API with <span class="ao-vchip secret">$API_TOKEN</span>.</span></div>
  <div class="ao-ed-l cur"><span class="n">6</span><span class="c"><span class="li">- </span>Check <span class="code">`openspec validate`</span> passes<span class="ao-ed-caret"></span></span></div>
 </div>
 <div class="ao-ed-bar"><span class="dirty">● unsaved</span><span>Ln 6, Col 34</span><span class="grow"></span><span>UTF-8 · LF</span><span>⌘⇧↵ send to pane</span></div>
</section></div>
</body>
</html>
