<!-- @dsCard group="Status" height=420 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusEditor</title></head>
<body>
<div class="ao-row" style="align-items:flex-start;gap:28px">
<div class="ao-frame" style="width:360px" role="dialog" aria-labelledby="se-t">
 <div class="ao-frame-head"><svg class="ao-icon" viewBox="0 0 8 8" aria-hidden="true"><rect x="2" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="5" y="6" width="1" height="1"/></svg><span id="se-t" class="ao-pixel">Status</span><span style="flex:1"></span><span class="small ao-dim">PROJ-477 rate limit</span></div>
 <div class="ao-frame-body" style="display:grid;gap:14px">
  <label class="ao-field"><span class="ao-pixel ao-dim">Label</span><input class="ao-input" value="Review"></label>
  <div class="small ao-dim">auto would say: Done · 1 of 2 tabs <a href="#">back to auto</a></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="ao-stat manual" style="--s-fg:var(--magenta);--s-edge:var(--magenta)">Review</span><span class="ao-stat manual" style="--s-fg:var(--red);--s-edge:var(--red)">Blocked</span><span class="ao-stat manual" style="--s-fg:var(--cyan);--s-edge:var(--cyan)">Testing</span><span class="ao-stat manual">Parked</span></div>
  <div class="ao-field"><span class="ao-pixel ao-dim">Accent</span><div class="ao-swatches"><span class="ao-sw none"></span><span class="ao-sw" style="--sw:var(--blue)"></span><span class="ao-sw" style="--sw:var(--cyan)"></span><span class="ao-sw" style="--sw:var(--green)"></span><span class="ao-sw on" style="--sw:var(--magenta)"></span><span class="ao-sw" style="--sw:var(--red)"></span><span class="ao-sw" style="--sw:var(--fg)"></span></div></div>
  <div class="ao-field"><span class="ao-pixel ao-dim">Background</span><div class="ao-swatches"><span class="ao-sw none"></span><span class="ao-sw" style="--sw:var(--tint-blue);--swe:var(--blue)"></span><span class="ao-sw" style="--sw:var(--tint-cyan);--swe:var(--cyan)"></span><span class="ao-sw" style="--sw:var(--tint-green);--swe:var(--green)"></span><span class="ao-sw on" style="--sw:var(--tint-magenta);--swe:var(--magenta)"></span><span class="ao-sw" style="--sw:var(--tint-red);--swe:var(--red)"></span></div></div>
 </div>
</div>
<div style="display:grid;gap:8px;width:272px"><span class="small ao-dim">preview</span>
 <div class="ao-st" style="--st-accent:var(--magenta);--st-bg:var(--tint-magenta)"><svg class="ao-icon" viewBox="0 0 8 8" aria-hidden="true"><rect x="1" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="0" y="5" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="0" y="7" width="1" height="1"/><rect x="1" y="7" width="1" height="1"/><rect x="2" y="7" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="5" y="7" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/></svg><span class="t">PROJ-477 rate limit</span><span class="ao-stat manual" style="--s-fg:var(--magenta);--s-edge:var(--magenta)">Review</span><span class="m">2 tabs</span></div>
</div></div>
</body>
</html>
