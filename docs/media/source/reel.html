<meta charset="utf-8">
<title>Terminescu Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed 1200x740 app "world" scaled into the stage, caption and scene chips below. Workbench tokens, dark only. */
:root{color-scheme:dark;--page:#0b0c10;--bg:#111318;--panel:#171a21;--panel2:#1d2029;--line:#2a2e38;--ls:#414756;--fg:#d7dae0;--dim:#8b91a0;--faint:#5c6270;--sh:#05060a;--amber:#e5a33a;--onam:#1a1205;--amedge:#f3c470;--green:#57ab5a;--red:#e5534b;--blue:#539bf5;--mag:#b083f0;--cyan:#39c5cf;--tb:#212f43;--tc:#1c353d;--tg:#21312a;--tm:#2f2b42;--tr:#382328;--ta:#383025;--sel:#294161;--add:#1d3324;--del:#3a2226;--mono:"Geist Mono",ui-monospace,Menlo,monospace;--px:"Silkscreen",var(--mono)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--fg);font-family:var(--mono)}
body{padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
header.top h1{font-family:var(--px);font-weight:400;font-size:22px;letter-spacing:1px;margin:0}
header.top h1 b{color:var(--amber);font-weight:400}
header.top p{margin:0;color:var(--dim);font-size:13px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:1200/740;overflow:hidden;background:var(--page);border:2px solid var(--ls);box-shadow:6px 6px 0 var(--sh)}
.world{position:absolute;left:0;top:0;width:1200px;height:740px;transform-origin:0 0;overflow:hidden;font-size:13px;line-height:20px;background:var(--page) radial-gradient(circle at 1px 1px,#1a1d25 1px,transparent 1.5px) 0 0/16px 16px}
.cap{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin-top:20px;align-items:start;min-height:118px}
.cap>div{min-width:0}
.cap .no{font-family:var(--px);font-size:12px;color:var(--amber);padding-top:4px;white-space:nowrap}
.cap h2{margin:0;font-size:20px;font-weight:600;line-height:28px;text-wrap:balance}
.cap p{margin:6px 0 0;color:var(--dim);font-size:14px;line-height:22px;max-width:780px}
.cap .keys{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.kc{display:inline-block;min-width:26px;padding:1px 7px;border:1px solid var(--ls);background:var(--panel2);box-shadow:2px 2px 0 var(--sh);font-size:12px;color:var(--fg);text-align:center}
.ctl{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;color:var(--fg);background:var(--panel2);border:1px solid var(--ls);box-shadow:3px 3px 0 var(--sh);padding:6px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--amber)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.play{background:var(--amber);color:var(--onam);border-color:var(--amedge)}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.chip{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 6px 8px;cursor:pointer;position:relative;min-width:0}
.chip span{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--amber)}
.chip.on{border-color:var(--amber);color:var(--fg)}
@media (max-width:760px){.chips{grid-template-columns:repeat(4,1fr)}.cap{grid-template-columns:1fr}.cap h2{font-size:17px}}

/* ---------- window ---------- */
.win{position:absolute;inset:0;background:var(--bg);display:grid;grid-template-rows:34px 1fr;border:2px solid var(--ls)}
.tbar{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:2px solid var(--line);position:relative}
.tl{width:11px;height:11px;display:inline-block;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.wm{font-family:var(--px);font-size:11px;margin-left:10px;color:var(--dim);letter-spacing:.5px}
.wm b{color:var(--amber);font-weight:400}
.ttl{position:absolute;left:0;right:0;text-align:center;color:var(--dim);font-size:12px;pointer-events:none}
.tbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative;z-index:1}
.body{display:grid;grid-template-columns:230px 1fr 280px;min-height:0}
.side{background:var(--panel);border-right:2px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:6px;overflow:hidden}
.lbl{font-family:var(--px);font-size:8px;letter-spacing:.5px;color:var(--faint);text-transform:uppercase;height:28px;display:flex;align-items:center;gap:6px;padding:0 12px}
.lbl .ct{color:var(--dim)}
.st,.fh{position:relative;height:28px;display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;color:var(--dim);overflow:hidden;white-space:nowrap}
.fh{height:30px;color:var(--fg)}
.st.in{padding-left:30px}
.st>*,.fh>*{position:relative;z-index:1}
.st .nm,.fh .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:120px}
.st .sub{flex:1;min-width:0;color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--faint);font-size:10px;width:8px}
.sq{display:flex;gap:4px;padding:0 0 4px 30px;height:10px}
.sq i{width:6px;height:6px;display:block}
.hl{position:absolute!important;inset:0;z-index:0!important;background:var(--panel2);box-shadow:inset 3px 0 0 var(--fg)}
.hl~*{color:var(--fg)}
.hl~.sub{color:var(--dim)}
.amb{position:absolute!important;inset:0;z-index:2!important;background:var(--amber);color:var(--onam);display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;white-space:nowrap}
.amb.in{padding-left:30px}
.amb b{margin-left:auto;font-family:var(--px);font-size:8px;font-weight:400}
.pill{font-family:var(--px);font-size:8px;line-height:14px;padding:0 5px;color:var(--c);background:var(--t);border:1px solid var(--c);white-space:nowrap}
.cmds{margin-top:auto;border-top:2px solid var(--line);padding-bottom:8px;position:relative}
.cmd{position:relative;display:flex;gap:8px;align-items:center;height:26px;padding:0 12px;color:var(--dim);white-space:nowrap}
.cmd>*{position:relative;z-index:1}
.cmd .ic{color:var(--green)}
.cmd .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.var{color:var(--blue)}
.ic{width:10px;height:10px;flex:none;display:inline-block;vertical-align:-1px}
.center{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.layer{position:absolute;inset:0;padding:14px 16px;overflow:hidden}
.ln{white-space:pre;min-height:20px}
.rel{position:relative}
.pr{color:var(--cyan)}.am{color:var(--amber)}.dm{color:var(--dim)}.fa{color:var(--faint)}.gr{color:var(--green)}.rd{color:var(--red)}.bl{color:var(--blue)}.mg{color:var(--mag)}.fg{color:var(--fg)}
.box{border:1px solid var(--ls);padding:8px 12px;margin:6px 0 10px;width:420px;white-space:normal}
/* split panes and side-by-side areas */
.pb{position:absolute;display:grid;grid-template-rows:22px 1fr;border-right:2px solid var(--line);border-bottom:2px solid var(--line);background:var(--bg);overflow:hidden}
.pb.foc{box-shadow:inset 0 0 0 2px var(--amber)}
.ph{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--dim);font-size:11px;white-space:nowrap}
.ph .mx{margin-left:auto;width:9px;height:9px;border:1px solid var(--dim)}
.ph .tg{font-family:var(--px);font-size:7px;color:var(--onam);background:var(--amber);padding:0 5px;line-height:13px}
.pc{position:relative;padding:10px 12px;overflow:hidden}
.ah{display:flex;align-items:center;gap:7px;padding:0 10px;height:26px;background:var(--panel);border-bottom:2px solid var(--line);white-space:nowrap;font-size:12px}
.ah.on{box-shadow:inset 0 -2px 0 var(--amber)}
.dz{position:absolute;border:2px dashed var(--amber);background:rgba(229,163,58,.08);z-index:4}
/* context panel */
.ctx{background:var(--panel);border-left:2px solid var(--line);overflow:hidden;min-height:0}
.sec{border-bottom:2px solid var(--line);padding-bottom:8px}
.vr{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:3px 12px;overflow:hidden}
.vk{color:var(--blue)}
.vv{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font-family:var(--px);font-size:7px;line-height:12px;padding:0 4px;border:1px solid var(--ls);color:var(--dim)}
.sb.session{color:var(--cyan);border-color:var(--cyan)}
.sb.secret{color:var(--mag);border-color:var(--mag)}
.pin{position:relative;margin:4px 12px;padding:6px 8px;background:var(--panel2);border:1px solid var(--line);box-shadow:3px 3px 0 var(--sh);white-space:normal;font-size:12px;line-height:17px;overflow:hidden}
.pin .h{font-family:var(--px);font-size:7px;color:var(--amber);display:flex;gap:6px;align-items:center}
.pin .h .ic{width:8px;height:8px}
.cl{display:flex;gap:6px;padding:2px 12px;align-items:center}
.cl .r{margin-left:auto}
.meter{height:8px;border:1px solid var(--ls);margin:4px 12px 2px;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--blue)}
.meter i.go{animation:mf .9s steps(5) var(--d) forwards}
@keyframes mf{to{width:81%;background:var(--amber)}}
.td,.fr{position:relative;display:flex;gap:8px;padding:2px 12px;color:var(--dim);white-space:nowrap;overflow:hidden}
.fr .s{font-family:var(--px);font-size:8px;width:12px}
.fr .s.m{color:var(--amber)}.fr .s.a{color:var(--green)}
.fr .n{margin-left:auto;font-size:11px}
/* overlays */
.toolbar{position:absolute;display:flex;background:var(--panel2);border:2px solid var(--ls);box-shadow:4px 4px 0 var(--sh);z-index:5;white-space:nowrap}
.toolbar span{padding:2px 10px;display:flex;gap:6px;align-items:center;border-right:1px solid var(--line);color:var(--fg)}
.toolbar span:last-child{border-right:0}
.toolbar .on{background:var(--amber);color:var(--onam)}
.toolbar em{font-style:normal;color:var(--dim);font-size:11px}
.toolbar .on em{color:var(--onam)}
.pop{position:absolute;background:var(--panel2);border:2px solid var(--ls);box-shadow:6px 6px 0 var(--sh);z-index:6;white-space:normal}
.pop .hd{font-family:var(--px);font-size:8px;color:var(--faint);padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.inp{margin:8px 12px;border:1px solid var(--amber);background:var(--bg);padding:3px 8px;white-space:nowrap;min-height:28px}
.it{display:flex;gap:10px;align-items:center;padding:4px 12px;color:var(--dim)}
.it.on{background:var(--sel);color:var(--fg)}
.it .t{margin-left:auto;font-family:var(--px);font-size:7px;color:var(--faint)}
.it .ic{color:var(--mag)}.it .ic.v{color:var(--blue)}
.prev{border-top:1px solid var(--line);padding:10px 12px;color:var(--fg);background:var(--bg)}
.ft{border-top:1px solid var(--line);padding:6px 12px;color:var(--faint);font-size:11px;display:flex;gap:14px;flex-wrap:wrap}
.vchip{display:inline-block;padding:0 5px;background:var(--tb);color:var(--blue);border:1px solid var(--blue);line-height:16px}
.vchip.sec{background:var(--tm);color:var(--mag);border-color:var(--mag)}
.caret{display:inline-block;width:8px;height:16px;background:var(--fg);vertical-align:-3px;animation:blink 1s steps(1) infinite}
.tag{font-family:var(--px);font-size:8px;padding:2px 6px;background:var(--amber);color:var(--onam)}
.ed{display:grid;grid-template-columns:38px 1fr;position:absolute;inset:0}
.ed .gut{background:var(--panel);color:var(--faint);text-align:right;padding:14px 8px 0 0;border-right:1px solid var(--line)}
.ed .txt{padding:14px 14px 0}
.waitbar{background:var(--amber);color:var(--onam);font-family:var(--px);font-size:8px;height:24px;display:flex;align-items:center;gap:10px;padding:0 10px;white-space:nowrap}
.split{display:flex;position:absolute;inset:0}
.split>.l{flex:1;position:relative;min-width:0}
.split>.r{position:relative;flex:0 0 0;overflow:hidden;border-left:2px solid var(--amber);background:var(--bg);min-width:0}
.dl{white-space:pre;padding:0 8px;min-height:20px}
.dl.d{background:var(--del)}.dl.a{background:var(--add)}
.callout{position:absolute;border:2px dashed var(--amber);z-index:8}
.callout b{position:absolute;font-family:var(--px);font-weight:400;font-size:10px;background:var(--amber);color:var(--onam);padding:3px 8px;white-space:nowrap}
.notif{position:absolute;right:16px;top:44px;width:300px;background:var(--panel2);border:2px solid var(--amber);box-shadow:6px 6px 0 var(--sh);padding:10px 12px;z-index:9;white-space:normal}
.notif .h{font-family:var(--px);font-size:8px;color:var(--amber)}
.perm{border:2px solid var(--amber);padding:8px 12px;width:470px;margin-top:8px;white-space:normal}
.perm .o{padding-left:10px}
.perm .o.on{background:var(--ta);color:var(--amber)}
.ghost{position:absolute;left:12px;top:12px;width:150px;height:28px;background:var(--panel2);border:2px solid var(--amber);box-shadow:5px 5px 0 var(--sh);display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--fg);white-space:nowrap}
.cursor{position:absolute;left:0;top:0;width:22px;height:22px;z-index:20;pointer-events:none}
.cursor svg{width:22px;height:22px;filter:drop-shadow(2px 2px 0 var(--sh))}
.hud{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;pointer-events:none;z-index:30}
.hud .k{position:absolute;bottom:0;font-size:28px;line-height:44px;padding:0 16px;min-width:56px;text-align:center;background:var(--panel2);color:var(--fg);border:2px solid var(--amber);box-shadow:5px 5px 0 var(--sh);opacity:0;animation:kh 1.3s steps(1) var(--d) both}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;background:var(--panel);border:2px solid var(--ls);box-shadow:8px 8px 0 var(--sh);padding:18px 22px}
.card .h{font-family:var(--px);font-size:10px;color:var(--amber);margin-bottom:10px}
.outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.big{font-family:var(--px);font-size:92px;line-height:1;letter-spacing:4px;color:var(--fg);text-shadow:6px 6px 0 var(--sh)}
.big .amb2{color:var(--amber)}
.tagl{font-size:20px;color:var(--dim)}
.kg{display:grid;grid-template-columns:repeat(3,230px);gap:10px 20px;text-align:left}
.kg div{display:flex;gap:12px;align-items:center;color:var(--dim);font-size:14px}
.kg .kc{min-width:64px;font-size:14px}
.fls{position:absolute!important;inset:0;z-index:3!important;background:var(--amber);opacity:0;pointer-events:none;animation:fl .7s steps(4) var(--d) both}

/* ---------- motion ---------- */
.a{animation:ap .24s steps(3) var(--d,0s) both}
.g{animation:gn .01s linear var(--o,0s) forwards}
.a.g{animation:ap .24s steps(3) var(--d,0s) both,gn .01s linear var(--o,0s) forwards}
.ag{overflow:hidden;animation:ag .3s steps(4) var(--d,0s) both}
.gh{overflow:hidden;max-height:30px;animation:gh .3s steps(4) var(--o,0s) forwards}
.ty{display:inline-block;vertical-align:bottom;overflow:hidden;white-space:pre;width:0;animation:ty calc(var(--n)*var(--s,55ms)) steps(var(--n)) var(--d,0s) forwards}
.sx{position:relative}
.sxo{position:absolute;inset:-1px -2px}
.sxw{display:block;height:100%;width:0;background:var(--sel);animation:sw .45s steps(6) var(--d) forwards}
.sxt{position:relative}
.split>.r.open{animation:spl .3s steps(4) var(--d) both,splo .3s steps(4) var(--o) forwards,hide .01s linear calc(var(--o) + .3s) forwards}
@keyframes hide{to{visibility:hidden;border-left-color:transparent}}
@keyframes ap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes gn{to{opacity:0;visibility:hidden}}
@keyframes ag{from{max-height:0;opacity:0}to{max-height:120px;opacity:1}}
@keyframes gh{to{max-height:0;opacity:0}}
@keyframes ty{to{width:calc(var(--n)*1ch)}}
@keyframes sw{to{width:100%}}
@keyframes kh{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@keyframes fl{0%{opacity:0}25%{opacity:.35}100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes spl{from{flex-basis:0}to{flex-basis:50%}}
@keyframes splo{to{flex-basis:0;border-left-width:0}}
.paused *,.paused{animation-play-state:paused!important}
/* still: the final frame, nothing transient */
.still *{animation:none!important}
.still .g,.still .gh,.still .tr,.still .cursor,.still .hud,.still .fls,.still .dz{display:none!important}
.still .ty{width:calc(var(--n)*1ch)}
.still .sxw{width:100%}
.still .meter i.go{width:81%;background:var(--amber)}
.still .split>.r.open{display:none}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
</style>

<div class="wrap">
 <header class="top"><h1>TERMINE<b>SCU</b> REEL</h1><p>14 scenes · about 2 minutes · invented data</p></header>
 <div class="stage" id="stage"><div class="world" id="world"></div></div>
 <div class="cap" id="cap"></div>
 <div class="ctl">
  <button class="btn" id="prev" aria-label="Previous scene">◀ PREV</button>
  <button class="btn play" id="pp" aria-label="Play or pause">❚❚ PAUSE</button>
  <button class="btn" id="next" aria-label="Next scene">NEXT ▶</button>
  <button class="btn" id="rep" aria-label="Replay scene">↺ REPLAY</button>
 </div>
 <div class="chips" id="chips"></div>
</div>

<script>
const ICONS={"pin":"..XXXX....XXXX.....XX....XXXXXX....XX......XX......XX......X....","doc":"XXXXX...X...XX..X...XXX.X.....X.X.XXX.X.X.....X.X.XXX.X.XXXXXXX.","play":".X.......XX......XXX.....XXXX....XXXX....XXX.....XX......X......","term":"XXXXXXXXX......XX.X....XX..X...XX.X..XXXX......XX......XXXXXXXXX","agent":"...XX...X..XX..X.X.XX.X...XXXX....XXXX...X.XX.X.X..XX..X...XX...","split":"XXXXXXXXX..X...XX..X...XX..XXXXXX..X...XX..X...XX..X...XXXXXXXXX","var":".XX..XX..X....X..X....X.X......X.X....X..X....X..XX..XX.........","merge":"X......XXX....XX.XX..XX...XXXX.....XX......XX......XX......XX...","pr":".X....X.XXX..XXX.X....X..X...X...X..X....X.X....XXX......X......","prompt":"........XX.......XX.......XX.....XX.....XX..........XXXX........","folder":"........XXX.....X..XXXXXX......XX......XX......XXXXXXXXX........","diff":"..X.......X.....XXXXX.....X.......X...........XXXXX.............","redo":"..XXXX...X....X.X.......XX.....XXX......X.X....X...XXXX.........."};
function ic(n,c=''){const r=ICONS[n]||'';let s='';for(let i=0;i<64;i++)if(r[i]==='X')s+=`<rect x="${i%8}" y="${i>>3}" width="1" height="1"/>`;return `<svg class="ic ${c}" viewBox="0 0 8 8" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`}
const ARROW='X.......XX......XXX.....XXXX....XXXXX...XXXXXX..XXX.....X..X....';
const arrow=()=>{let s='';for(let i=0;i<64;i++)if(ARROW[i]==='X')s+=`<rect x="${i%8}" y="${i>>3}" width="1" height="1"/>`;return `<svg viewBox="0 0 8 8" fill="#d7dae0" shape-rendering="crispEdges">${s}</svg>`};
const ap=(d,html,tag='span',cls='',st='')=>`<${tag} class="a ${cls}" style="--d:${d}s;${st}">${html}</${tag}>`;
const gn=(o,html,tag='span',cls='',st='')=>`<${tag} class="g ${cls}" style="--o:${o}s;${st}">${html}</${tag}>`;
const apgn=(d,o,html,tag='span',cls='',st='')=>`<${tag} class="a g ${cls}" style="--d:${d}s;--o:${o}s;${st}">${html}</${tag}>`;
const ty=(d,t,sp=55)=>`<span class="ty" style="--n:${[...t].length};--d:${d}s;--s:${sp}ms">${t}</span>`;
const stack=(...xs)=>`<span style="display:inline-grid;min-width:0">${xs.map(x=>`<span style="grid-area:1/1;display:flex;gap:7px;align-items:center;min-width:0">${x}</span>`).join('')}</span>`;
const layers=(...xs)=>`<div style="display:grid">${xs.map(x=>`<div style="grid-area:1/1;min-width:0">${x}</div>`).join('')}</div>`;
const ln=(t,cls='')=>`<div class="ln ${cls}">${t}</div>`;
const lnA=(d,t)=>`<div class="ln a" style="--d:${d}s">${t}</div>`;

/* ---------------- player ---------------- */
const world=document.getElementById('world'),stage=document.getElementById('stage'),cap=document.getElementById('cap'),chipsEl=document.getElementById('chips'),pp=document.getElementById('pp');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let idx=0,t=0,playing=!reduce,last=0;
chipsEl.innerHTML=SC.map((s,i)=>`<button class="chip" data-i="${i}"><span>${String(i+1).padStart(2,'0')} ${s.chip}</span><i></i></button>`).join('');
const chips=[...chipsEl.children];
chips.forEach(c=>c.onclick=()=>{go(+c.dataset.i);if(!reduce)setPlay(true)});
function fit(){world.style.transform=`scale(${stage.clientWidth/1200})`}
new ResizeObserver(fit).observe(stage);fit();
function render(){const s=SC[idx];world.innerHTML=s.html();world.className='world'+(reduce?' still':'')+(playing?'':' paused');
 cap.innerHTML=`<div class="no">${String(idx+1).padStart(2,'0')} / ${SC.length}</div><div><h2>${s.title}</h2><p>${s.text}</p>${s.keys.length?`<div class="keys">${s.keys.map(kc).join('')}</div>`:''}</div>`;
 chips.forEach((c,i)=>{c.classList.toggle('on',i===idx);c.querySelector('i').style.width=i<idx?'100%':'0'})}
function go(i){idx=(i+SC.length)%SC.length;t=0;render()}
function setPlay(p){playing=p;world.classList.toggle('paused',!p);pp.innerHTML=p?'❚❚ PAUSE':'▶ PLAY';if(p&&idx===SC.length-1&&t>=SC[idx].dur)go(0)}
pp.onclick=()=>{if(reduce)world.classList.remove('still');setPlay(!playing)};
document.getElementById('prev').onclick=()=>go(idx-1);
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('rep').onclick=()=>{if(reduce)world.classList.remove('still');go(idx);if(!playing)setPlay(true)};
addEventListener('keydown',e=>{if(e.target.closest('button')&&e.key===' ')return;if(e.key===' '){e.preventDefault();setPlay(!playing)}else if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1)});
function tick(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;
 if(playing&&!world.classList.contains('still')){t+=dt;const s=SC[idx];chips[idx].querySelector('i').style.width=Math.min(100,t/s.dur*100)+'%';
  if(t>=s.dur){if(idx<SC.length-1)go(idx+1);else{t=s.dur;setPlay(false)}}}
 requestAnimationFrame(tick)}
render();if(reduce)pp.innerHTML='▶ PLAY';requestAnimationFrame(tick);
</script>
