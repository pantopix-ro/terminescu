# License gate for the app's Rust dependencies (add-public-release D8). CI and the release job run
# `cargo deny check licenses`; a crate outside this list fails the build and is named.

[graph]
# The app ships for Apple silicon only, so other targets' crates don't count.
targets = ["aarch64-apple-darwin"]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",

  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Terminescu's own crates carry its own license.
exceptions = [
  { allow = ["FSL-1.1-ALv2"], crate = "terminescu-cli" },
  { allow = ["FSL-1.1-ALv2"], crate = "terminescu-core" },
  { allow = ["FSL-1.1-ALv2"], crate = "terminescu-desktop" },
  { allow = ["FSL-1.1-ALv2"], crate = "terminescu-plugin-api" },
  { allow = ["FSL-1.1-ALv2"], crate = "terminescu-plugin-claude" },
  { allow = ["FSL-1.1-ALv2"], crate = "terminescu-protocol" },
  { allow = ["FSL-1.1-ALv2"], crate = "terminescu-ptyd" },
]

[licenses.private]
ignore = false
