[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/protocol",
  "crates/ptyd",
  "crates/cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
terminescu-core = { path = "crates/core" }
terminescu-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
