[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/protocol",
  "crates/ptyd",
  "crates/cli",
  "apps/desktop/src-tauri",
]
# Vendored with a small patch (D31); built as a path dependency, never tested or linted here.
exclude = ["crates/vendor/alacritty_terminal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "FSL-1.1-ALv2"
publish = false

[workspace.dependencies]
terminescu-core = { path = "crates/core" }
terminescu-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
libc = "0.2"
