[package]
name = "terminescu-desktop"
description = "The Terminescu app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The plugins compiled in (add-plugin-architecture D11). `--no-default-features` builds the
# bare terminal.
[features]
default = ["plugin-claude"]
plugin-claude = ["dep:terminescu-plugin-claude"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
terminescu-core.workspace = true
terminescu-protocol.workspace = true
terminescu-plugin-api.workspace = true
terminescu-plugin-claude = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
# 2.7.0 shipped 2026-10-14; 2.8 is under two weeks old.
tauri-plugin-notification = "~2.7.0"
tauri-plugin-dialog = "=2.8.3"
# 2.14.0 shipped 2026-10-14; 2.14.1 is under two weeks old.
tauri-plugin-updater = "=2.14.0"
# Already in the tree through tauri; only its timer is used here.
tokio = { version = "1", features = ["time"] }

# Already in the tree through tauri: the pixel context menu sends Copy, Paste and the other
# Edit actions down the responder chain, as the Edit menu does.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
