[package]
name = "terminescu-ptyd"
description = "Pty daemon that owns every Terminescu shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
terminescu-protocol.workspace = true
alacritty_terminal = { path = "../vendor/alacritty_terminal" }
portable-pty = "0.9"
libc.workspace = true
serde_json.workspace = true
zeroize = "1"

[dev-dependencies]
terminescu-core.workspace = true

[lib]
name = "terminescu_ptyd"
path = "src/lib.rs"

[[bin]]
name = "terminescu-ptyd"
path = "src/main.rs"
