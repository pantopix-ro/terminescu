# The gates CLAUDE.md asks for before a commit, on every pull request and before a release:
# types, unit tests, the e2e suite on WebKit, and rustfmt, clippy and the Rust tests. The bare
# builds prove the app stands without its plugins (add-plugin-architecture D11).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    # Repo variable CI_RUNS_ON: "local" for the local Mac runner; anything else uses GitHub.
    runs-on: ${{ vars.CI_RUNS_ON == 'local' && fromJSON('["self-hosted","terminescu-runner"]') || 'macos-15' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:rust
      - name: bare builds
        run: |
          cargo clippy -p terminescu-desktop --no-default-features -- -D warnings
          cargo check -p terminescu-desktop --no-default-features --features plugin-claude
          cargo check -p terminescu-desktop --no-default-features --features plugin-git
          VITE_PLUGINS=none pnpm --filter @terminescu/desktop build
      - name: e2e
        working-directory: apps/desktop
        run: |
          pnpm exec playwright install webkit
          pnpm e2e
