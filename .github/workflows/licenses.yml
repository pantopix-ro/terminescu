# add-public-release task 2.1 (D8): every crate the app ships has an allowed license.
name: Licenses

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  cargo-deny:
    # Repo variable CI_RUNS_ON: "local" for the local Mac runner; anything else uses GitHub.
    runs-on: ${{ vars.CI_RUNS_ON == 'local' && fromJSON('["self-hosted","terminescu-runner"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Check licenses
        run: cargo deny check licenses
